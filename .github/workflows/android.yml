name: PoldoKeyboard CI

# A ogni push su qualsiasi branch, così ogni modifica produce un APK da provare; anche a mano dalla pagina Actions
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  build:
    # Versione fissa: dal 19 ottobre 2026 ubuntu-latest passa a Ubuntu 26 e cambierebbe gli strumenti sotto i piedi
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4
      # L'app usa la rete solo per scaricare il catalogo dei modelli, in un unico file: classi di rete nel codice
      # Kotlin o Java di qualunque altro file fermano la run (la cartella cpp contiene il submodule di whisper.cpp)
      - name: Check network code
        run: |
          permesso=lib/localai/src/main/kotlin/io/github/donatogranvilla/poldokeyboard/localai/model/ScaricatoreCatalogo.kt
          rete='java\.net\.(URL|HttpURLConnection|URLConnection|Socket|ServerSocket|DatagramSocket)\b|javax\.net\.ssl|okhttp3|io\.ktor|retrofit2|android\.net\.http|DownloadManager|WebView'
          trovati=$(grep -rlE --include='*.kt' --include='*.java' --exclude-dir=cpp "$rete" app/src lib/localai/src \
              | grep -vFx "$permesso" || true)
          if [ -n "$trovati" ]; then echo "Codice di rete fuori da $permesso:"; echo "$trovati"; exit 1; fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - name: Build with Gradle
        run: ./gradlew clean assembleDebug
      # Le varianti del backend CPU si caricano a runtime: se una manca il motore non parte su quei processori,
      # quindi la run si ferma prima di pubblicare l'APK
      - name: Check native libraries and VAD model
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" 'lib/arm64-v8a/*'
          for lib in whisper_jni whisper ggml ggml-base \
              ggml-cpu-android_armv8.0_1 ggml-cpu-android_armv8.2_1 ggml-cpu-android_armv8.2_2 \
              ggml-cpu-android_armv8.6_1 ggml-cpu-android_armv9.0_1 ggml-cpu-android_armv9.2_1 \
              ggml-cpu-android_armv9.2_2 sherpa-onnx-jni; do
            unzip -Z1 "$apk" | grep -Fxq "lib/arm64-v8a/lib$lib.so" || { echo "Manca lib$lib.so nell'APK"; exit 1; }
          done
          unzip -Z1 "$apk" | grep -Fxq "assets/vad/ggml-silero-v6.2.0.bin" || { echo "Manca il modello del VAD nell'APK"; exit 1; }
          # Librerie con i simboli di debug: il passo di strip non ha trovato la NDK e l'APK cresce di 10 MB
          unzip -p "$apk" lib/arm64-v8a/libwhisper.so > /tmp/libwhisper.so
          if readelf -S /tmp/libwhisper.so | grep -q '.debug_info'; then echo "Librerie native con i simboli di debug"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Dopo il caricamento dell'APK e senza bloccare la run: un test che fallisce non deve togliere l'APK da provare
      # --continue: i test di ogni modulo girano anche se quelli di un altro falliscono
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --continue
