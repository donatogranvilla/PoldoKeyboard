name: PoldoKeyboard CI

# A ogni push su qualsiasi branch, così ogni modifica produce un APK da provare; anche a mano dalla pagina Actions
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  build:
    # Versione fissa: dal 19 ottobre 2026 ubuntu-latest passa a Ubuntu 26 e cambierebbe gli strumenti sotto i piedi
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4
      # L'app usa la rete solo per scaricare il catalogo dei modelli: classi di rete altrove fermano la run
      - name: Check network code
        run: .github/controlli/codice-di-rete.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - name: Build with Gradle
        run: ./gradlew clean assembleDebug
      # Librerie native di tutte le varianti del processore e modello del VAD, prima di pubblicare l'APK
      - name: Check native libraries and VAD model
        run: .github/controlli/contenuto-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Dopo il caricamento dell'APK e senza bloccare la run: un test che fallisce non deve togliere l'APK da provare
      # --continue: i test di ogni modulo girano anche se quelli di un altro falliscono
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --continue
