name: PoldoKeyboard CI

# A ogni push su qualsiasi branch, così ogni modifica produce un APK da provare; anche a mano dalla pagina Actions
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  build:
    # Versione fissa: dal 19 ottobre 2026 ubuntu-latest passa a Ubuntu 26 e cambierebbe gli strumenti sotto i piedi
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - name: Build with Gradle
        run: ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Dopo il caricamento dell'APK e senza bloccare la run: un test che fallisce non deve togliere l'APK da provare
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest
